<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="findtheinvisiblecheese.css">
    <link rel="icon" href="cheese.png">
    <title>Find the Invisible Cheese</title>
</head>
<body background="background.jpg">
    <img id="cheese" width="150" height="150" src="cheese.png">
    <label id="cheesesfound">Cheeses Found: 0</label>
    <label id="fastesttime">Fastest Time: 0:00</label>
    <label id="stopwatch">Stopwatch: 0:00</label><p style="margin-top: 8%;"></p>
    <label id="directions">Move your cursor (or finger) around the screen in different areas.
        When the beeping sound seems the loudest, click on that spot, and you found the invisible cheese.
    </label><br>
    <button id="startButton">Start</button>
    <script src="findtheinvisiblecheese.js"></script>
</body>
</html>
